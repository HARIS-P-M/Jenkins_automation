name: Trigger Jenkins Pipeline

on:
  push:
    branches:
      - main

jobs:
  trigger-jenkins:
    runs-on: ubuntu-latest
    steps:
      - name: Send Build Trigger to Jenkins
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          FRONTEND_ORIGIN: ${{ secrets.FRONTEND_ORIGIN }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
          JENKINS_API_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}
        run: |
          echo "DEBUG: EC2_HOST length is ${#EC2_HOST}"
          echo "DEBUG: SSH_KEY length is ${#EC2_SSH_KEY}"
          if [ -z "$EC2_HOST" ]; then
            echo "ERROR: EC2_HOST secret is MISSING in GitHub!"
            exit 1
          fi
          curl -i -X POST "https://smee.io/haris-jenkins-automation" \
            --user "admin:$JENKINS_API_TOKEN" \
            --data-urlencode "token=haris-token" \
            --data-urlencode "EC2_HOST=$EC2_HOST" \
            --data-urlencode "EC2_SSH_KEY=$EC2_SSH_KEY" \
            --data-urlencode "MONGO_URI=$MONGO_URI" \
            --data-urlencode "JWT_SECRET=$JWT_SECRET" \
            --data-urlencode "FRONTEND_ORIGIN=$FRONTEND_ORIGIN" \
            --data-urlencode "EMAIL_USER=$EMAIL_USER" \
            --data-urlencode "EMAIL_PASS=$EMAIL_PASS" \
            --data-urlencode "TWILIO_ACCOUNT_SID=$TWILIO_ACCOUNT_SID" \
            --data-urlencode "TWILIO_AUTH_TOKEN=$TWILIO_AUTH_TOKEN" \
            --data-urlencode "TWILIO_PHONE_NUMBER=$TWILIO_PHONE_NUMBER"
