name: Trigger Jenkins Pipeline

on:
  push:
    branches:
      - main

jobs:
  trigger-jenkins:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/contact-manager-frontend:latest,ghcr.io/${{ github.repository_owner }}/contact-manager-frontend:${{ github.run_number }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/contact-manager-backend:latest,ghcr.io/${{ github.repository_owner }}/contact-manager-backend:${{ github.run_number }}

      - name: Prepare Kubernetes Manifests
        run: |
          sed -i "s|ghcr.io/YOUR_REPO/contact-manager-frontend:latest|ghcr.io/${{ github.repository_owner }}/contact-manager-frontend:${{ github.run_number }}|g" k8s/frontend.yaml
          sed -i "s|ghcr.io/YOUR_REPO/contact-manager-backend:latest|ghcr.io/${{ github.repository_owner }}/contact-manager-backend:${{ github.run_number }}|g" k8s/backend.yaml

      - name: Deploy to EC2 K3s
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          echo "$EC2_SSH_KEY" > ec2_key.pem
          chmod 600 ec2_key.pem
          ssh -o StrictHostKeyChecking=no -i ec2_key.pem ubuntu@$EC2_HOST mkdir -p ~/contact-manager-k8s
          scp -o StrictHostKeyChecking=no -i ec2_key.pem k8s/frontend.yaml k8s/backend.yaml k8s/mongo.yaml ubuntu@$EC2_HOST:~/contact-manager-k8s/
          ssh -o StrictHostKeyChecking=no -i ec2_key.pem ubuntu@$EC2_HOST 'kubectl apply -f ~/contact-manager-k8s/'
          ssh -o StrictHostKeyChecking=no -i ec2_key.pem ubuntu@$EC2_HOST 'kubectl rollout restart deployment backend frontend'
          rm -f ec2_key.pem
