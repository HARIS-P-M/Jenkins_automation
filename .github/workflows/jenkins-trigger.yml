name: Trigger Jenkins Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  trigger-jenkins:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inject IP into Jenkinsfile
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          # Swap the placeholder with the real IP from secrets
          sed -i "s/EC2_HOST_PLACEHOLDER/$EC2_HOST/g" Jenkinsfile
          
          # Configure Git
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          
          # Commit and push so Jenkins checks out the file with the REAL IP
          git add Jenkinsfile
          git commit -m "ci: inject EC2 IP for deployment [skip ci]" || echo "No changes to commit"
          git push origin main

      - name: Notify (Jenkins triggered via GitHub Webhook + Smee)
        run: |
          echo "✅ Code pushed to main."
          echo "Jenkins is triggered automatically via GitHub Webhook → Smee.io → localhost:8080"
          echo "Make sure smee-client is running on your local machine:"
          echo "  npx smee-client --url https://smee.io/haris-jenkins-automation --target http://localhost:8080/github-webhook/"
