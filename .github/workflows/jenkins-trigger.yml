name: Trigger Jenkins Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  trigger-jenkins:
    runs-on: ubuntu-latest
    steps:
      - name: Send Build Trigger to Jenkins
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          FRONTEND_ORIGIN: ${{ secrets.FRONTEND_ORIGIN }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
          JENKINS_API_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}
        run: |
          # We pass parameters in the URL query string because Smee often drops the POST body
          curl -i -X POST "https://smee.io/haris-jenkins-automation?token=haris-token&EC2_HOST=$(echo $EC2_HOST | jq -rr @uri)&EC2_SSH_KEY=$(echo $EC2_SSH_KEY | jq -rr @uri)&MONGO_URI=$(echo $MONGO_URI | jq -rr @uri)&JWT_SECRET=$(echo $JWT_SECRET | jq -rr @uri)&FRONTEND_ORIGIN=$(echo $FRONTEND_ORIGIN | jq -rr @uri)&EMAIL_USER=$(echo $EMAIL_USER | jq -rr @uri)&EMAIL_PASS=$(echo $EMAIL_PASS | jq -rr @uri)&TWILIO_ACCOUNT_SID=$(echo $TWILIO_ACCOUNT_SID | jq -rr @uri)&TWILIO_AUTH_TOKEN=$(echo $TWILIO_AUTH_TOKEN | jq -rr @uri)&TWILIO_PHONE_NUMBER=$(echo $TWILIO_PHONE_NUMBER | jq -rr @uri)" \
            --user "admin:$JENKINS_API_TOKEN"
