name: Trigger Jenkins Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  trigger-jenkins:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inject IP into Jenkinsfile
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          sed -i "s/EC2_HOST_PLACEHOLDER/$EC2_HOST/g" Jenkinsfile
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add Jenkinsfile
          git commit -m "Inject EC2 IP for deployment [skip ci]" || echo "No changes to commit"
          git push origin main

      - name: Trigger Jenkins Build
        env:
          JENKINS_API_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}
          JENKINS_URL: ${{ secrets.JENKINS_URL }}
        run: |
          echo "Triggering Jenkins job: contact-manager-final"
          curl -v -X POST \
            "${JENKINS_URL}/job/contact-manager-final/build?token=github-trigger-token" \
            --max-time 30 \
            -o /dev/null \
            -w "HTTP Status: %{http_code}\n" \
            || curl -v -X POST \
              "${JENKINS_URL}/job/contact-manager-final/build" \
              --user "admin:${JENKINS_API_TOKEN}" \
              --max-time 30 \
              -o /dev/null \
              -w "HTTP Status: %{http_code}\n"
