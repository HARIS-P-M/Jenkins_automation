name: Trigger Jenkins Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  trigger-jenkins:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inject IP into Jenkinsfile
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          # Swap the placeholder with the real IP from secrets
          sed -i "s/EC2_HOST_PLACEHOLDER/$EC2_HOST/g" Jenkinsfile
          
          # Configure Git
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          
          # Commit and push the change so Jenkins pulls the file with the REAL IP
          git add Jenkinsfile
          git commit -m "Inject EC2 IP for deployment [skip ci]" || echo "No changes to commit"
          git push origin main

      - name: Trigger Jenkins Build
        env:
          JENKINS_API_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}
          JENKINS_URL: ${{ secrets.JENKINS_URL }}
        run: |
          # Trigger Jenkins job via its Remote Build Trigger API
          # JENKINS_URL secret should be your public Jenkins URL, e.g.:
          #   http://<your-ngrok-or-smee-forwarded-host>/job/contact-manager/build?token=<REMOTE_TOKEN>
          # Or if using user:apitoken auth:
          curl -i -X POST "${JENKINS_URL}/job/contact-manager-final/build" \
            --user "admin:${JENKINS_API_TOKEN}" \
            --data-urlencode "json={}" \
            -f || echo "Jenkins trigger failed — check JENKINS_URL secret and that Jenkins is reachable"
